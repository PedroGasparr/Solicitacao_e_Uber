<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Chamados</title>
  <link rel="icon" type="image/x-icon" href="img/GZL - Logos_pages-to-jpg-0004.jpg">
  <!-- Adicionando Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
  <style>
      /* Reset de estilo e configuração de tipografia */
      * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e6e9ed);
      color: #333;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 30px;
      color: #2c3e50;
      text-align: center;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      animation: fadeInDown 1s ease-out;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 img {
      height: 50px;
      width: auto;
    }

    h1::after {
      content: '';
      display: block;
      height: 4px;
      width: 80px;
      background-color: #3498db;
      margin: 20px auto 0;
      border-radius: 2px;
      animation: scaleX 1s ease-out;
    }

    .card-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .card {
      background-color: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      color: #333;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
      position: relative;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
      animation-delay: calc(var(--index) * 0.2s);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      font-size: 1.6rem;
      color: #3498db;
      margin-bottom: 15px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .card p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .card .button {
      background-color: #3498db;
      color: white;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s ease, transform 0.3s ease;
      margin-top: 15px;
      display: inline-block;
    }

    .card .button:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }

    .card .button:active {
      background-color: #2980b9;
      transform: translateY(0);
    }

    /* Animação para fade-in */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleX {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    /* Cores e bordas diferentes para status */
    .card.approved {
      background: #e8f5e9;
      border-left: 5px solid #4CAF50;
    }

    .card.rejected {
      background: #ffebee;
      border-left: 5px solid #f44336;
    }

    .card.pending {
      background: #fff8e1;
      border-left: 5px solid #FFC107;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 10px;
    }

    .approved-badge {
      background-color: #4CAF50;
      color: white;
    }

    .rejected-badge {
      background-color: #f44336;
      color: white;
    }

    .pending-badge {
      background-color: #FFC107;
      color: #333;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      h1 {
        font-size: 2.2rem;
        flex-direction: column;
        text-align: center;
      }
      h1 img {
        height: 40px;
      }
      .card-container {
        width: 100%;
        padding: 10px;
      }
      .card {
        padding: 20px;
      }
      .card h3 {
        font-size: 1.4rem;
      }
      .card p {
        font-size: 1rem;
      }
      .card .button {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
      }
    }
    
  </style>
</head>
<body>
  <h1>Aprovação de Voucher</h1>
  <div id="cards-container" class="card-container"></div>

  <script>
    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDmhnN2jEQWMeAwSLJiAfNHUapM5_HgiOw",
      authDomain: "appguizilim.firebaseapp.com",
      databaseURL: "https://appguizilim-default-rtdb.firebaseio.com",
      projectId: "appguizilim",
      storageBucket: "appguizilim.firebasestorage.app",
      messagingSenderId: "669241709255",
      appId: "1:669241709255:web:bde10d035254b74c9724e2",
      measurementId: "G-J2MKLZ5XL0"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Solicitar o nome completo da pessoa antes de carregar o conteúdo
    const nomeCompleto = prompt("Por favor, insira seu nome completo:");

    // Função para carregar os dados do Firebase
    function loadDataFromFirebase() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '<p>Carregando suas solicitações...</p>';

      // Referência para o nó 'solicitacoes_uber' no Firebase
      const ref = database.ref('solicitacoes_uber');
      
      ref.once('value').then((snapshot) => {
        const data = snapshot.val();
        container.innerHTML = '';
        
        if (!data) {
          container.innerHTML = '<p>Nenhuma solicitação encontrada.</p>';
          return;
        }

        let cards = [];
        let index = 0;
        
        // Converter o objeto em array e ordenar por dataSolicitacao (mais recente primeiro)
        const dataArray = Object.entries(data).map(([key, value]) => ({
          id: key,
          ...value
        })).sort((a, b) => {
          // Converter datas para timestamp para ordenação
          const dateA = new Date(a.dataSolicitacao).getTime();
          const dateB = new Date(b.dataSolicitacao).getTime();
          return dateB - dateA;
        });

        // Filtrar apenas as solicitações do usuário atual
        const userRequests = dataArray.filter(item => 
          item.solicitante && item.solicitante.toLowerCase().includes(nomeCompleto.toLowerCase())
        );

        if (userRequests.length === 0) {
          container.innerHTML = `<p>Nenhuma solicitação encontrada para ${nomeCompleto}.</p>`;
          return;
        }

        userRequests.forEach((item) => {
          // Determinar a classe CSS com base no status
          let statusClass = '';
          let statusBadge = '';
          
          if (item.status) {
            const statusLower = item.status.toLowerCase();
            
            if (statusLower.includes('aprovado')) {
              statusClass = 'approved';
              statusBadge = '<span class="status-badge approved-badge">APROVADO</span>';
            } else if (statusLower.includes('recusado') || statusLower.includes('negado')) {
              statusClass = 'rejected';
              statusBadge = '<span class="status-badge rejected-badge">RECUSADO</span>';
            } else {
              statusClass = 'pending';
              statusBadge = '<span class="status-badge pending-badge">PENDENTE</span>';
            }
          }

          // Formatar a data
          const formattedDate = item.dataSolicitacao || 'Data não disponível';
          const processedDate = item.dataProcessamento ? `Processado em: ${item.dataProcessamento}` : '';
          const processedBy = item.processadoPor ? `Por: ${item.processadoPor}` : '';

          // Criar o card HTML
          const card = `
            <div class="card ${statusClass}" style="--index: ${index++}">
              <h3>Solicitação #${item.idNumerico || 'N/A'} ${statusBadge}</h3>
              <p><strong>Solicitante:</strong> ${item.solicitante || 'N/A'}</p>
              <p><strong>Data:</strong> ${formattedDate}</p>
              <p><strong>Local de Saída:</strong> ${item.localSaida || 'N/A'}</p>
              <p><strong>Local de Destino:</strong> ${item.localDestino || 'N/A'}</p>
              <p><strong>Data de Utilização:</strong> ${item.dataUtilizacao || 'N/A'}</p>
              <p><strong>Motivo:</strong> ${item.motivoTransporte || 'N/A'}</p>
              <p><strong>Valor Solicitado:</strong> ${item.valorCorrida || 'N/A'}</p>
              ${item.valorAprovado ? `<p><strong>Valor Aprovado:</strong> ${item.valorAprovado}</p>` : ''}
              ${processedDate ? `<p><strong>${processedDate}</strong></p>` : ''}
              ${processedBy ? `<p><strong>${processedBy}</strong></p>` : ''}
            </div>
          `;
          
          cards.push(card);
        });

        container.innerHTML = cards.join('');
      }).catch((error) => {
        console.error('Erro ao carregar dados do Firebase:', error);
        container.innerHTML = '<p>Ocorreu um erro ao carregar as solicitações. Por favor, tente novamente mais tarde.</p>';
      });
    }

    // Carregar os dados quando a página estiver pronta
    document.addEventListener('DOMContentLoaded', loadDataFromFirebase);
  </script>
</body>
</html>
